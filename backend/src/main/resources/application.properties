spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

payflow.jwt.secret=${JWT_SECRET:}
payflow.jwt.issuer=${JWT_ISSUER:payflow}
payflow.jwt.audience=${JWT_AUDIENCE:payflow-api}
payflow.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}

payflow.session.absolute-ttl=${SESSION_ABSOLUTE_TTL:7d}
payflow.session.idle-ttl=${SESSION_IDLE_TTL:24h}
payflow.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
payflow.session.trusted-origins=${SESSION_TRUSTED_ORIGINS:https://localhost}
