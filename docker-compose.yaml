services:
  postgres:
    image: postgres:18.6
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
      POSTGRES_USER: ${POSTGRES_USER:-payflow_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow_demo}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payflow}
      DB_USERNAME: ${POSTGRES_USER:-payflow_dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-payflow_demo}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded secret of at least 32 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-payflow}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-payflow-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-7d}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-24h}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TRUSTED_ORIGINS: ${SESSION_TRUSTED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
